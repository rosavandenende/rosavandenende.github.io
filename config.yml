          subtitle: "I am Rosa van den Ende. I am a postdoctoral researcher at RPTU Kaiserslautern-Landau, working with Daniel Heyen on designing early warning systems for tipping points. In 2025, I obtained my PhD in Applied Mathematics from Université Paris 1 Panthéon-Sorbonne and in Economics from Universität Bielefeld, under the supervision of Agnieszka Rusinowska and Manuel Foerster.  <br><br> I am mostly interested in network theory and game theory and how this can inform fair climate policy. "
